name: Build Plugin JAR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dua JDK: 17 buat generate Gradle wrapper (gradle bawaan runner versi
      # baru butuh JDK17 buat jalan sendiri), 11 buat build project (SDK
      # PowerTunnel dependency-nya kompatibel Java 8/11).
      - name: Set up JDK 17 & JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            11

      - name: Generate Gradle wrapper (if missing)
        if: hashFiles('gradlew') == ''
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle wrapper --gradle-version 7.0.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin jar
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: ./gradlew jar --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: gtredirect-plugin-jar
          path: build/libs/*.jar
          if-no-files-found: error
