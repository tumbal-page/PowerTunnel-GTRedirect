plugins {
    id 'java'
}

group 'io.github.tumbalpage.powertunnel.plugins'
version '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation('io.github.krlvm.powertunnel:sdk') {
        version {
            branch = 'master'
        }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
}

jar {
    archiveBaseName = 'gtredirect'
}

test {
    useJUnitPlatform()
}
